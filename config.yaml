simulation:
  model: "llama-3.1-8b-instant"
  temperature: 0.9
  max_tokens: 350

agents:
  psychology_educated:
    names: ["田中先生", "鈴木博士", "佐藤さん", "伊藤さん", "渡辺さん",
            "山口さん", "松本さん", "井上さん", "木村さん", "林さん"]
  non_educated:
    names: ["山田さん", "中村さん", "小林さん", "加藤さん", "吉田さん",
            "斎藤さん", "清水さん", "池田さん", "橋本さん", "石川さん"]

scenario:
  name: "隕石衝突後の不安定な社会"
  phases:
    - id: 1
      name: "衝突から3ヶ月"
      description: "隕石衝突から3ヶ月が経過した。渡航禁止は続いているが国内流通は一部機能している。スーパーには商品があったりなかったり、価格は高騰している。近所の人が大量に買い込んでいるのを見た。自分はどうするか。"
    - id: 2
      name: "噂の拡散"
      description: "SNSで『来週から食料配給制になる』という噂が広まった。真偽は不明。近隣住民の一部がスーパーに殺到し始めている。政府からの公式発表はまだない。"
    - id: 3
      name: "隣人との摩擦"
      description: "隣の家族が食料を大量に備蓄しているらしいという話が回ってきた。自分の備蓄は1週間分しかない。子供のいる家庭が『少し分けてほしい』と頼みに来た。"
    - id: 4
      name: "コミュニティの分断"
      description: "地域で食料の共同管理をしようという提案が出た。しかし『自分で確保したものを渡したくない』という人も多い。どちらの側につくか迫られている。"
    - id: 5
      name: "決断の時"
      description: "食料の流通がさらに不安定になった。共同管理グループは着実に食料を確保できている。一方で単独行動の人は食料不足に直面し始めている。今後どう行動するか。"

actions:
  COOPERATE: "他者と食料・情報を共有し、コミュニティで協力して乗り越えようとする"
  TEACH: "食料の保存方法や調達方法など有益な知識を周囲に教える"
  HOARD: "食料や物資を自分・家族だけのために確保し、他者には渡さない"
  ISOLATE: "他者と関わらず、自分だけで静かに生き延びようとする"
  PANIC: "不安と恐怖から冷静な判断ができず、衝動的に行動してしまう"